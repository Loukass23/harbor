name: tauri-build

# Run by hand from the Actions tab. Download the Windows NSIS installer or the
# Linux packages from the run's artifacts. Nothing is signed or published.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=6144
  # The extension compat layer is not in this repository, so a runner cannot stage its runtime and
  # these installers ship without extension support. The build says so on every run. Drop this line
  # the day the layer ships with the checkout, and the build starts refusing to omit it.
  HARBOR_CAPSTAN_OPTIONAL: "1"

jobs:
  build:
    name: ${{ matrix.platform.name }} (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - name: Linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: contains(matrix.platform.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libudev-dev \
            libmpv-dev \
            libgtk-3-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            patchelf \
            xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The Pokémon engine (games side feature) is not built here, as in local
      # builds. Tauri still needs its resource folder to exist.
      - name: Create empty Pokémon engine resource folder
        shell: bash
        run: mkdir -p src-tauri/resources/pokemon-engine

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Verify HTTP redirect boundaries
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test --manifest-path scripts/http-redirect-tests/Cargo.toml --locked --lib

      - name: Fetch libmpv (Windows)
        if: contains(matrix.platform.runner, 'windows')
        run: pnpm run setup:libmpv

      - name: Fetch mpv (Windows x64)
        if: matrix.platform.target == 'x86_64-pc-windows-msvc'
        run: pnpm run setup:mpv

      - name: Fetch external binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cd src-tauri/binaries
          TARGET="${{ matrix.platform.target }}"
          EXT=""
          if [[ "$TARGET" == *"windows"* ]]; then EXT=".exe"; fi

          echo "Downloading yt-dlp..."
          if [[ "$TARGET" == *"windows"* ]]; then
            curl --retry 6 --retry-delay 4 --retry-all-errors -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -o "yt-dlp-${TARGET}${EXT}"
          else
            curl --retry 6 --retry-delay 4 --retry-all-errors -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp" -o "yt-dlp-${TARGET}${EXT}"
          fi
          chmod +x "yt-dlp-${TARGET}${EXT}" || true

          echo "Fetching ffmpeg and ffprobe..."
          if [[ "$TARGET" == *"windows"* ]]; then
            curl --retry 6 --retry-delay 4 --retry-all-errors -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -o ffmpeg.zip
            unzip -j ffmpeg.zip "*/bin/ffmpeg.exe" "*/bin/ffprobe.exe"
            mv ffmpeg.exe "ffmpeg-${TARGET}${EXT}"
            mv ffprobe.exe "ffprobe-${TARGET}${EXT}"
          else
            if [[ "$TARGET" == *"aarch64"* ]]; then
              curl --retry 6 --retry-delay 4 --retry-all-errors -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linuxarm64-gpl.tar.xz" -o ffmpeg.tar.xz
            else
              curl --retry 6 --retry-delay 4 --retry-all-errors -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" -o ffmpeg.tar.xz
            fi
            tar -xf ffmpeg.tar.xz --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
            mv ffmpeg "ffmpeg-${TARGET}${EXT}"
            mv ffprobe "ffprobe-${TARGET}${EXT}"
          fi

      - name: harbor-core check
        working-directory: harbor-core
        run: |
          cargo check
          cargo test --all-targets

      - name: Tauri build
        if: "!contains(matrix.platform.runner, 'ubuntu')"
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.platform.target }}

      - name: Build Linux system packages
        if: contains(matrix.platform.runner, 'ubuntu')
        run: pnpm tauri:build:linux-system --target ${{ matrix.platform.target }} --bundles deb

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-${{ matrix.platform.name }}
          path: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: warn

